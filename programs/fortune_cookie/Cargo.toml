[package]
name = "fortune_cookie"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "fortune_cookie"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
custom-panic = []
# Enable Switchboard VRF support (requires network to resolve crate first):
#   1. cargo add switchboard-on-demand --optional --manifest-path programs/fortune_cookie/Cargo.toml
#   2. anchor build -- --features vrf
vrf = []  # populated automatically when you add the dep above

[dependencies]
anchor-lang = "0.31.1"
anchor-spl = "0.31.1"
# switchboard-on-demand = { version = "0.1", optional = true }  # uncomment after: cargo add switchboard-on-demand --optional


[dev-dependencies]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[patch.crates-io]
constant_time_eq = { version = "0.4.1" }
