[package]
name = "fortune_cookie"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "fortune_cookie"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
custom-panic = []
# Enable Switchboard VRF support: anchor build -- --features vrf
vrf = ["switchboard-on-demand"]

[dependencies]
anchor-lang = "0.31.1"
anchor-spl = "0.31.1"
# Pulled in only when feature "vrf" is active
switchboard-on-demand = { version = "0.1", optional = true }


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[patch.crates-io]
constant_time_eq = { version = "0.4.1" }
